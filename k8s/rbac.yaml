apiVersion: v1
kind: ServiceAccount
metadata:
  name: worklearn-backend
  namespace: worklearn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-job-manager
  namespace: worklearn-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worklearn-backend-sandbox-job-manager
  namespace: worklearn-sandbox
subjects:
  - kind: ServiceAccount
    name: worklearn-backend
    namespace: worklearn
roleRef:
  kind: Role
  name: sandbox-job-manager
  apiGroup: rbac.authorization.k8s.io
