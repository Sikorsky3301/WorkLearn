# Spins up the whole local stack in one command, frontend included. K8s
# (k8s/README.md) is a separate deployment target and still runs the frontend
# locally with `npm run dev` — that doc is unaffected by this file.
#
# Usage:
#   docker compose up postgres backend frontend  # app only
#   docker compose up                            # app + LiteLLM Proxy
#   docker compose exec backend python seed.py   # once, after first `up`, to get demo accounts
#
# `backend` reads backend/.env for everything (AI provider keys, JWT secret,
# etc. — see backend/.env.example) except DATABASE_URL, which is overridden
# below to point at the `postgres` service instead of whatever
# Supabase/localhost URL backend/.env has for running uvicorn directly.
#
# `frontend` runs the Vite dev server (not a production build) — matches
# `backend`'s own dev-oriented Dockerfile (no --reload either), and keeps
# `docker compose up` behaving the same as running both halves locally. Vite
# proxies /api and /static to BACKEND_ORIGIN (see vite.config.js) rather than
# baking a URL into the browser bundle, so it's pointed at the `backend`
# service's Docker DNS name below instead of the 127.0.0.1 default that only
# resolves on the host.
#
# litellm-proxy/litellm-proxy-db are optional (see
# backend/litellm-proxy/README.md) — needs LITELLM_MASTER_KEY and the
# provider API keys set in your shell or a .env file in this same directory.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: worklearn
    volumes:
      - worklearn_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/worklearn
    volumes:
      # The code-sandbox grader shells out to `docker run` for each submission
      # (see app/services/sandbox_runners/docker_runner.py) — mounting the
      # host's socket lets the backend container spawn sibling grading
      # containers on the HOST's daemon. Security tradeoff worth knowing: this
      # is equivalent to giving the backend container root on the host (anyone
      # who can run arbitrary code in this container can control the whole
      # Docker daemon, not just its own containers). Acceptable for a single
      # trusted deployment; if this backend is ever exposed to less-trusted
      # code paths, put a narrow broker service in front of the socket instead
      # of mounting it directly.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with the HOST at the same physical directory (see
      # docker_runner.py's comment on -v path resolution above) — this
      # container writes submission files under /sandbox-work, and passes
      # the matching /worklearn/sandbox-work host path to `docker run -v` so
      # the HOST daemon mounts the same directory into the grading sibling
      # container. Matches settings.sandbox_shared_dir / sandbox_hostpath_dir
      # in app/core/config.py.
      - /worklearn/sandbox-work:/sandbox-work
      # Chained-task artifacts (see app/services/artifacts.py) — one task's
      # graded output becomes the next task's input, persisted under
      # /app/data/artifacts/<enrollment_id>/. Without this mount it's ordinary
      # container filesystem: it works, right up until the next `docker
      # compose up -d --build backend`, which throws every student's
      # in-progress chained-task data away along with the old container.
      - /worklearn/backend-data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Host-side port unchanged (5173) so the VPS's nginx config doesn't need
    # to change what it proxies to — only WHAT'S listening behind it changed,
    # from Vite's dev server to nginx serving the production build (see
    # frontend/Dockerfile). Container-side is 80 now, nginx's own default,
    # not 5173 (Vite's default) — nothing in this image is Vite anymore.
    # No BACKEND_ORIGIN here either — that was read by the Vite dev proxy,
    # which no longer exists; /api and /static are now proxied straight to
    # the backend by the HOST's nginx (see /etc/nginx/sites-available/worklearn).
    ports:
      - "127.0.0.1:5173:80"

  litellm-proxy-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_PROXY_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      - litellm_proxy_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433, not 5432 — avoids colliding with any local Postgres already used for the app's own DATABASE_URL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm-proxy:
    image: ghcr.io/berriai/litellm-database:latest
    restart: unless-stopped
    depends_on:
      litellm-proxy-db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./backend/litellm-proxy/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_PROXY_DATABASE_URL: postgresql://litellm:${LITELLM_PROXY_DB_PASSWORD:-litellm}@litellm-proxy-db:5432/litellm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: ["--config", "/app/config.yaml"]

volumes:
  worklearn_db_data:
  litellm_proxy_db_data:
