# Serves the production `vite build` output inside the frontend container.
# No proxying here — /api and /static are handled by the HOST's nginx
# (see /etc/nginx/sites-available/worklearn), which forwards them straight
# to the backend container. This nginx only ever serves static files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file (i.e. every client-side
    # route — /dashboard, /simulations/foo/task/3, etc.) resolves to
    # index.html so React Router can take over, exactly like Vite's dev
    # server's own history-fallback behavior did.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
