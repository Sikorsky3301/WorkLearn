[pytest]
asyncio_mode = auto
testpaths = tests
# Session-scoped, not the pytest-asyncio default of function-scoped — the DB
# engine (app/database.py's module-level `engine`) is created once per test
# session by the session-scoped _test_database fixture, so every test needs
# to run on that same event loop or asyncpg's connection pool ends up bound
# to a closed loop from a previous test (surfaces as a confusing
# "another operation is in progress" / protocol-state error).
asyncio_default_fixture_loop_scope = session
